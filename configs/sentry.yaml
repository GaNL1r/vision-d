# enemy_color: "red"
enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 1280
image_height: 720
usb_frame_rate: 60
usb_exposure: 400 #1-80000______250
usb_gamma: 160
usb_gain: 10 #0-96

#####-----相机拓扑与方位-----#####
# UVC角度均相对前向云台坐标系。149度对角FOV按1280x720等距鱼眼模型初估，
# 两台UVC取正负103.9度，使其与主相机之间的三个盲区约为22.3度；实机标定后替换。
cameras:
  - role: front
    type: hikrobot
    vid_pid: "2bdf:0001"
    exposure_ms: 5
    gain: 16.9
    yaw_offset_deg: 0
    pitch_offset_deg: 0

  - role: left
    type: uvc
    device: "video2"
    yaw_offset_deg: 103.9
    pitch_offset_deg: 0
    fov_h_deg: 129.9
    fov_v_deg: 73.1

  - role: right
    type: uvc
    device: "video0"
    yaw_offset_deg: -103.9
    pitch_offset_deg: 0
    fov_h_deg: 129.9
    fov_v_deg: 73.1

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----USB云台通信参数-----#####
com_port: "/dev/serial/by-id/usb-YueLuEmbedded_Vision_Comm_port_206C327D4232-if00"
gimbal_command_enabled: false # 仅接收下位机状态，不发送云台或发射指令

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 25
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -0.8 # degree -2.5
pitch_offset: -1  # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
left_yaw_offset: -1
right_yaw_offset: -0.6
decision_speed: 10 # rad/s
high_speed_delay_time: 0.026 # s
low_speed_delay_time: 0.010 # s

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 3 #距离判断阈值
auto_fire: false # 是否由自瞄控制射击

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

camera_matrix: [2394.2968351123723, 0, 700.794528351022, 0, 2392.2453563225076, 513.82049364671298, 0, 0, 1]
distort_coeffs: [-0.10002693673957498, 0.15369818776897518, -0.0020910886143118606, -0.0014207511445048437, 0]

# 相机同理想情况的偏角: yaw1.69 pitch0.30 roll-0.07 degree
# 标定板到世界坐标系原点的水平距离: 2.56 m
# 标定板同竖直摆放时的偏角: yaw11.36 pitch7.38 roll0.83 degree
R_camera2gimbal: [-0.02943460703555785, 0.0052379785200594667, 0.99955298383311619, -0.99956599593985174, -0.0013479215865163055, -0.029427926671258341, 0.0011931761959813833, -0.99998537323723913, 0.0052753807583291934]
t_camera2gimbal: [-0.038221732177855426, -0.0072747106983809132, 0.14118517902311795]

